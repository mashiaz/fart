name: Restart Supabase project

on:
  schedule:
    # Every 6h (UTC).
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: dipglrsfglwyubqvydjw
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo secret SUPABASE_ACCESS_TOKEN is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          code=$(curl -s -o /dev/stderr -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restart")
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
